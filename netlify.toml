# Netlify 배포 설정
# 이 프로젝트는 Next.js 정적 export(output: "export") 사이트로,
# 빌드 시 out/ 디렉터리에 정적 파일이 생성된다.
# 게시 폴더를 out/ 으로 명시해 변경 사항이 항상 라이브에 반영되도록 한다.

[build]
  command = "npm run build"
  publish = "out"

[build.environment]
  # .nvmrc 의 Node 버전을 사용
  NODE_VERSION = "20"

# 정적 자산 캐시 (HTML 은 항상 최신 확인, 정적 청크는 장기 캐시)
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"

[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
